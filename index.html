<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonnaع — Egypt's Manufacturing Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15221F;
  --ink-soft:#4A5A56;
  --paper:#FFFFFF;
  --mist:#F4F7F6;
  --teal:#0E6B5E;
  --teal-dark:#0A4A42;
  --teal-tint:#E4F0EE;
  --line:#E2E9E7;
  --amber:#C98A2B;
  --radius:16px;
  --shadow:0 1px 2px rgba(21,34,31,.05),0 8px 24px -12px rgba(21,34,31,.12);
  --font-display:'Alexandria',sans-serif;
  --font-body:'IBM Plex Sans Arabic',sans-serif;
  --font-mono:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;

  /* ---- Blueprint grid system ---- */
  --grid-fine:rgba(14,107,94,.045);
  --grid-bold:rgba(14,107,94,.09);
  --grid-node:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27120%27%20height%3D%27120%27%3E%3Cg%20stroke%3D%27%230E6B5E%27%20stroke-width%3D%271.1%27%20stroke-opacity%3D%270.30%27%3E%3Cpath%20d%3D%27M0%20-5V5M-5%200H5M120%20-5V5M115%200H125M0%20115V125M-5%20120H5M120%20115V125M115%20120H125%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);color:var(--ink);background:var(--paper);line-height:1.6;font-size:15px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.25}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.container{max-width:1160px;margin:0 auto;padding:0 24px}

/* ---------- Global blueprint grid background ---------- */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:
    linear-gradient(var(--grid-bold) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-bold) 1px, transparent 1px),
    linear-gradient(var(--grid-fine) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px);
  background-size:120px 120px,120px 120px,30px 30px,30px 30px;
}

/* ---------- Header ---------- */
header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(21,34,31,.04);
}
.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:68px;
  position:relative;
  z-index:1;
}

.logo{
  display:flex;
  align-items:center;
  gap:0;
  font-family:var(--font-display);
  font-weight:800;
  font-size:24px;
  letter-spacing:-.02em;
  text-decoration:none;
  color:var(--ink);
  transition:opacity .2s ease;
  flex-shrink:0;
}
.logo:hover{opacity:0.8}
.logo .logo-ain{color:var(--teal)}

nav.main-nav{display:flex;gap:2px;align-items:center;z-index:1}
.nav-link{padding:8px 16px;border-radius:12px;font-weight:500;color:var(--ink-soft);font-size:14.5px;background:none;border:none;transition:all .2s ease}
.nav-link:hover{background:var(--mist);color:var(--ink)}
.nav-link.active{color:var(--teal);background:var(--teal-tint);font-weight:600}

.header-actions{display:flex;align-items:center;gap:12px;z-index:1;flex-shrink:0}
.lang-toggle{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--mist)}
.lang-toggle button{padding:7px 14px;background:transparent;border:none;font-size:13px;font-weight:600;color:var(--ink-soft);transition:all .2s ease}
.lang-toggle button.on{background:var(--ink);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:12px;font-weight:600;font-size:14px;border:none;transition:all .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(14,107,94,.2)}
.btn-primary{background:linear-gradient(135deg,#128978,var(--teal));color:#fff;box-shadow:0 4px 14px -4px rgba(14,107,94,.5)}
.btn-primary:hover{background:linear-gradient(135deg,#0E6B5E,var(--teal-dark))}
.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-tint)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}

.mobile-menu-btn{display:none;background:none;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:22px;color:var(--ink);flex-shrink:0;line-height:1}
.mobile-menu-btn:hover{border-color:var(--teal);color:var(--teal)}

.desktop-only{display:inline-flex}

/* Mobile menu overlay */
.mobile-menu-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(21,34,31,.5);z-index:200}
.mobile-menu-overlay.open{display:block}

.mobile-menu-panel{position:fixed;top:0;bottom:0;right:0;width:85%;max-width:360px;background:#fff;z-index:201;padding:24px 20px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;box-shadow:-4px 0 30px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .3s ease}
[dir="rtl"] .mobile-menu-panel{right:auto;left:0;transform:translateX(-100%);box-shadow:4px 0 30px rgba(0,0,0,.15)}
.mobile-menu-panel.open{transform:translateX(0)}

.mobile-menu-close{background:none;border:none;font-size:24px;color:var(--ink-soft);padding:4px 8px;cursor:pointer;line-height:1;align-self:flex-end}
.mobile-menu-close:hover{color:var(--ink)}

.mobile-lang-toggle{display:flex;gap:8px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.mobile-lang-toggle button{flex:1;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:14px;font-weight:600;color:var(--ink-soft);transition:all .2s ease}
.mobile-lang-toggle button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.mobile-menu-link{padding:14px 16px;border:none;background:none;border-radius:12px;font-size:15px;font-weight:600;color:var(--ink);text-align:start;transition:all .15s ease;display:flex;align-items:center;gap:10px;width:100%}
.mobile-menu-link:hover{background:var(--mist)}
.mobile-menu-divider{height:1px;background:var(--line);margin:8px 0}
.mobile-menu-btn-full{width:100%;padding:14px;font-size:15px;border-radius:12px}

/* Hero */
.hero{position:relative;border-bottom:1px solid var(--line);overflow:hidden;background:radial-gradient(680px 360px at 50% 6%, rgba(14,107,94,.09), transparent 60%),radial-gradient(560px 300px at 88% 4%, rgba(201,138,43,.06), transparent 62%),linear-gradient(180deg,#F6FAF9 0%,#fff 100%)}
/* blueprint grid that carries all the way through the search area — edge vignette only */
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background-image:var(--grid-node),linear-gradient(var(--grid-bold) 1px, transparent 1px),linear-gradient(90deg, var(--grid-bold) 1px, transparent 1px),linear-gradient(var(--grid-fine) 1px, transparent 1px),linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px);background-size:120px 120px,120px 120px,120px 120px,30px 30px,30px 30px;background-position:center top;-webkit-mask-image:radial-gradient(140% 130% at 50% 30%, #000 62%, transparent 100%);mask-image:radial-gradient(140% 130% at 50% 30%, #000 62%, transparent 100%)}
/* soft teal glow behind the wordmark */
.hero::after{content:"";position:absolute;left:50%;top:-30px;width:640px;height:440px;transform:translateX(-50%);pointer-events:none;z-index:0;background:radial-gradient(closest-side, rgba(14,107,94,.13), transparent 72%)}
.hero-inner{position:relative;padding:60px 0 80px;text-align:center;max-width:760px;margin:0 auto;z-index:1}
.hero-inner>*{animation:fadeUp .6s ease backwards}
.hero-inner>*:nth-child(1){animation-delay:.02s}
.hero-inner>*:nth-child(2){animation-delay:.08s}
.hero-inner>*:nth-child(3){animation-delay:.14s}
.hero-inner>*:nth-child(4){animation-delay:.20s}
.hero-inner>*:nth-child(5){animation-delay:.26s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* live "active nodes" pulsing on the schematic */
.hero-node{position:absolute;z-index:1;width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(14,107,94,.45);animation:ping 3.4s ease-out infinite;pointer-events:none}
.hero-node.n1{top:120px;inset-inline-start:13%;animation-delay:0s}
.hero-node.n2{top:232px;inset-inline-end:15%;animation-delay:1.1s;background:var(--amber);box-shadow:0 0 0 0 rgba(201,138,43,.4)}
.hero-node.n3{bottom:118px;inset-inline-start:23%;animation-delay:2.2s}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(14,107,94,.45)}70%{box-shadow:0 0 0 16px rgba(14,107,94,0)}100%{box-shadow:0 0 0 0 rgba(14,107,94,0)}}
@media(max-width:760px){.hero-node{display:none}}

.brand-display{position:relative;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;width:280px;height:280px}
.orbit-ring{position:absolute;border:2px dashed rgba(14,107,94,.2);border-radius:50%;animation:orbitSpin 25s linear infinite;pointer-events:none}
.orbit-ring.r1{width:200px;height:200px;top:40px;left:40px}
.orbit-ring.r2{width:240px;height:240px;top:20px;left:20px;border-color:rgba(201,138,43,.18);animation-duration:35s;animation-direction:reverse}
.brand-word{font-family:var(--font-display);font-size:clamp(48px,8vw,72px);font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--ink);position:relative;z-index:3}
.brand-word .ain{color:var(--teal)}
@keyframes orbitSpin{to{transform:rotate(360deg)}}

.mast-line{font-size:clamp(15px,2.4vw,18px);color:var(--ink-soft);font-weight:500;margin-top:8px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--teal-dark);font-weight:600;font-size:12px;padding:6px 14px;border-radius:99px;margin-bottom:20px;font-family:var(--font-mono);backdrop-filter:blur(6px)}
[dir="ltr"] .eyebrow{letter-spacing:.04em;text-transform:uppercase}
.eyebrow .dot{width:7px;height:7px;border-radius:99px;background:var(--teal);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.float-chips-container{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.float-chip-set{position:absolute;inset:0;transition:opacity .8s ease, transform .8s ease}
.float-chip-set.hidden{opacity:0;transform:translateY(30px);pointer-events:none}
.float-chip-set.visible{opacity:1;transform:translateY(0)}
.float-chip{position:absolute;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;animation:floaty 6s ease-in-out infinite}
.float-chip small{display:block;font-weight:500;color:var(--ink-soft);font-size:11.5px;line-height:1.3}
.set1 .fc1{top:90px;inset-inline-start:3%;animation-delay:0s}
.set1 .fc2{top:200px;inset-inline-end:3%;animation-delay:1.6s}
.set1 .fc3{bottom:70px;inset-inline-start:8%;animation-delay:3.2s}
.set2 .fc1{top:70px;inset-inline-end:5%;animation-delay:0.5s}
.set2 .fc2{top:250px;inset-inline-start:4%;animation-delay:2s}
.set2 .fc3{bottom:100px;inset-inline-end:6%;animation-delay:0s}
.set3 .fc1{top:120px;inset-inline-start:5%;animation-delay:0.3s}
.set3 .fc2{top:170px;inset-inline-end:7%;animation-delay:1.2s}
.set3 .fc3{bottom:60px;inset-inline-start:3%;animation-delay:2.5s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media(max-width:1060px){.float-chips-container{display:none}}

.hero-slider{position:relative;max-width:660px;margin:24px auto 0;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.hs-track{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.hs-slide{flex:0 0 100%;padding:24px 62px 16px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.hs-slide .ic{width:46px;height:46px;border-radius:14px;background:var(--teal-tint);display:grid;place-items:center;font-size:22px}
.hs-slide h3{font-size:18.5px;font-weight:800;letter-spacing:-.01em}
.hs-slide p{font-size:13.5px;color:var(--ink-soft);max-width:460px;line-height:1.55}
.hs-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-size:17px;line-height:1;color:var(--ink-soft);z-index:2;transition:border-color .15s,color .15s}
.hs-arrow:hover{border-color:var(--teal);color:var(--teal)}
.hs-prev{inset-inline-start:10px}.hs-next{inset-inline-end:10px}
.hs-dots{display:flex;gap:7px;justify-content:center;padding:0 0 16px}
.hs-dot{width:8px;height:8px;border-radius:99px;background:var(--line);border:none;padding:0;cursor:pointer;transition:width .25s,background .25s}
.hs-dot.on{width:24px;background:var(--teal)}
.hero h1{font-size:clamp(28px,4.5vw,44px);font-weight:800;letter-spacing:-.02em;margin:20px 0 14px;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p.sub{color:var(--ink-soft);font-size:16px;max-width:560px;margin:0 auto 32px}
.search-bar{display:flex;align-items:center;background:rgba(255,255,255,.92);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;max-width:640px;margin:0 auto 22px;gap:8px;position:relative;backdrop-filter:blur(8px)}
.search-bar::before,.search-bar::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--teal);opacity:.5;pointer-events:none}
.search-bar::before{top:-6px;left:-6px;border-right:0;border-bottom:0}
.search-bar::after{bottom:-6px;right:-6px;border-left:0;border-top:0}
.search-bar svg{flex:none;margin-inline-start:12px;color:var(--ink-soft)}
.search-bar input{flex:1;border:none;outline:none;font-size:15.5px;padding:10px 4px;background:transparent;min-width:0}
.hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-stats{display:flex;gap:0;justify-content:center;margin-top:44px;flex-wrap:wrap}
.hero-stat{text-align:center;padding:0 30px;position:relative}
.hero-stat+.hero-stat::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:1px;background:var(--line)}
.hero-stat b{display:block;font-family:var(--font-mono);font-size:26px;font-weight:500;color:var(--teal-dark)}
.hero-stat span{font-size:13px;color:var(--ink-soft)}

.ticker{background:var(--teal-dark);color:#DCEEE9;overflow:hidden;border-bottom:1px solid var(--line);position:relative;z-index:1}
.ticker::before,.ticker::after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:1;pointer-events:none}
.ticker::before{inset-inline-start:0;background:linear-gradient(to right,var(--teal-dark),transparent)}
.ticker::after{inset-inline-end:0;background:linear-gradient(to left,var(--teal-dark),transparent)}
[dir="rtl"] .ticker::before{background:linear-gradient(to left,var(--teal-dark),transparent)}
[dir="rtl"] .ticker::after{background:linear-gradient(to right,var(--teal-dark),transparent)}
.ticker-track{display:flex;gap:40px;width:max-content;padding:11px 0;animation:tickL 46s linear infinite}
[dir="rtl"] .ticker-track{animation-name:tickR}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes tickL{to{transform:translateX(-50%)}}
@keyframes tickR{to{transform:translateX(50%)}}
.tk{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;white-space:nowrap;opacity:.92}
.tk .sep{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.35)}

section.block{position:relative;padding:60px 0;z-index:1}
section.block::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(14,107,94,.10) 1px, transparent 1px),linear-gradient(90deg, rgba(14,107,94,.10) 1px, transparent 1px);background-size:36px 36px;background-position:-2px -2px;-webkit-mask-image:radial-gradient(ellipse at 0% 0%, #000 20%, transparent 70%);mask-image:radial-gradient(ellipse at 0% 0%, #000 20%, transparent 70%)}
section.block.alt{background-color:var(--mist);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
section.block.alt::before{background-image:linear-gradient(rgba(14,107,94,.12) 1px, transparent 1px),linear-gradient(90deg, rgba(14,107,94,.12) 1px, transparent 1px);background-size:32px 32px;opacity:0.8}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;position:relative;z-index:1}
.section-head h2{font-size:26px;font-weight:700;letter-spacing:-.01em}
.section-head p{color:var(--ink-soft);font-size:14.5px;margin-top:4px}
.link-more{color:var(--teal);font-weight:600;font-size:14px;background:none;border:none;display:inline-flex;align-items:center;gap:6px}
.link-more:hover{text-decoration:underline}

.industry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;position:relative;z-index:1}
.industry-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:20px 14px;text-align:center;transition:border-color .15s,transform .15s;display:block;width:100%}
.industry-card:hover{border-color:var(--teal);transform:translateY(-2px)}
.industry-card .icon{width:46px;height:46px;border-radius:13px;background:var(--teal-tint);display:grid;place-items:center;font-size:22px;margin:0 auto 10px;transition:transform .18s ease}
.industry-card:hover .icon{transform:rotate(-6deg) scale(1.08)}
.industry-card .name{font-weight:600;font-size:13.5px;line-height:1.35}
.industry-card .count{font-size:12px;color:var(--ink-soft)}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;position:relative;z-index:1}
.factory-card{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:box-shadow .15s,transform .15s;text-align:start;width:100%;padding:0}
.factory-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
/* technical corner-brackets on hover */
.factory-card::before,.factory-card::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--teal);opacity:0;transition:opacity .18s, top .18s, bottom .18s, left .18s, right .18s;z-index:3;pointer-events:none}
.factory-card::before{top:12px;left:12px;border-right:0;border-bottom:0}
.factory-card::after{bottom:12px;right:12px;border-left:0;border-top:0}
.factory-card:hover::before{opacity:.8;top:9px;left:9px}
.factory-card:hover::after{opacity:.8;bottom:9px;right:9px}
.factory-card .cover{height:104px;position:relative;overflow:hidden}
.factory-card .cover::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px),radial-gradient(220px 90px at 85% 0%,rgba(255,255,255,.20),transparent 70%);background-size:22px 22px,22px 22px,auto}
.factory-card .fcode{position:absolute;top:10px;inset-inline-start:12px;z-index:2;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.92)}
.cover-ic{position:absolute;inset-inline-end:12px;bottom:6px;font-size:40px;opacity:.45;filter:saturate(.6);z-index:1;transform:rotate(-8deg)}
.factory-card .flogo{position:absolute;bottom:-22px;inset-inline-start:18px;width:52px;height:52px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--teal);z-index:2}
.factory-card .body{padding:32px 18px 18px}
.factory-card h3{font-size:16px;font-weight:700;margin-bottom:2px}
.factory-card .meta{font-size:12.5px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.factory-card .desc{font-size:13px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}

function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}

function openMobileMenu(){

let rotTimer=null;
const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function initHero(){
  clearInterval(rotTimer);
  const track=document.getElementById("hsTrack"),slider=document.getElementById("heroSlider");
  if(track&&slider){
    const n=t("slides").length,dots=[...slider.querySelectorAll(".hs-dot")];let ix=0;
    const sign=LANG==="ar"?1:-1;
    const show=i=>{ix=(i+n)%n;track.style.transform=`translateX(${sign*ix*100}%)`;dots.forEach((d,k)=>d.classList.toggle("on",k===ix));};
    const play=()=>{if(REDUCED)return;clearInterval(rotTimer);rotTimer=setInterval(()=>show(ix+1),4200);};
    slider.querySelector("#hsPrev").addEventListener("click",()=>{show(ix-1);play();});
    slider.querySelector("#hsNext").addEventListener("click",()=>{show(ix+1);play();});
    dots.forEach(d=>d.addEventListener("click",()=>{show(Number(d.dataset.ix));play();}));
    slider.addEventListener("mouseenter",()=>clearInterval(rotTimer));slider.addEventListener("mouseleave",play);
    let tx=null;slider.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
    slider.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<40)return;const fwd=LANG==="ar"?dx>0:dx<0;show(ix+(fwd?1:-1));play();},{passive:true});
    show(0);play();
  }
  initFloatRotation();
}
function initFloatRotation(){
  clearInterval(floatInterval);
  const container=document.querySelector(".float-chips-container");if(!container)return;
  const sets=container.querySelectorAll(".float-chip-set");if(sets.length<2)return;
  floatSetIndex=0;
  floatInterval=setInterval(()=>{const currentSet=sets[floatSetIndex];const nextIndex=(floatSetIndex+1)%sets.length;const nextSet=sets[nextIndex];if(currentSet){currentSet.classList.remove("visible");currentSet.classList.add("hidden");}if(nextSet){nextSet.classList.remove("hidden");nextSet.classList.add("visible");}floatSetIndex=nextIndex;},3500);
}

function render(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
  clearInterval(floatInterval);
  let body="";
  if(VIEW.name==="home")body=homeHTML();
  else if(VIEW.name==="factories")body=factoriesHTML();
  else if(VIEW.name==="factory")body=factoryProfileHTML(VIEW.id);
  else if(VIEW.name==="requests")body=requestsHTML();
  else if(VIEW.name==="request")body=requestDetailHTML(VIEW.id);
  document.getElementById("app").innerHTML=headerHTML()+mobileMenuHTML()+`<main>${body}</main><div class="container" style="padding:0 24px 28px"><p style="font-size:12px;color:var(--ink-soft);text-align:center">${t("demo_note")}</p></div>`+footerHTML();
  if(VIEW.name==="home")initHero();else clearInterval(rotTimer);
}
render();
</script>
</body>
</html>
