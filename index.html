<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonnaع — Egypt's Manufacturing Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15221F;
  --ink-soft:#4A5A56;
  --paper:#FFFFFF;
  --mist:#F4F7F6;
  --teal:#0E6B5E;
  --teal-dark:#0A4A42;
  --teal-tint:#E4F0EE;
  --line:#E2E9E7;
  --amber:#C98A2B;
  --radius:16px;
  --shadow:0 1px 2px rgba(21,34,31,.05),0 8px 24px -12px rgba(21,34,31,.12);
  --font-display:'Alexandria',sans-serif;
  --font-body:'IBM Plex Sans Arabic',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);color:var(--ink);background:var(--paper);line-height:1.6;font-size:15px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.25}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.container{max-width:1160px;margin:0 auto;padding:0 24px}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;gap:28px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.logo .mark{width:36px;height:36px;border-radius:11px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;padding-bottom:4px}
.logo .ain{color:var(--teal)}
nav.main-nav{display:flex;gap:4px;flex:1}
.nav-link{padding:8px 14px;border-radius:10px;font-weight:500;color:var(--ink-soft);font-size:14.5px;background:none;border:none}
.nav-link:hover{background:var(--mist);color:var(--ink)}
.nav-link.active{color:var(--teal);background:var(--teal-tint);font-weight:600}
.header-actions{display:flex;align-items:center;gap:10px}
.lang-toggle{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.lang-toggle button{padding:6px 12px;background:#fff;border:none;font-size:13px;font-weight:600;color:var(--ink-soft)}
.lang-toggle button.on{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;font-weight:600;font-size:14.5px;border:none;transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--teal);color:#fff;box-shadow:0 4px 14px -4px rgba(14,107,94,.5)}
.btn-primary:hover{background:var(--teal-dark)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn-sm{padding:8px 14px;font-size:13.5px;border-radius:10px}

/* ---------- Hero ---------- */
.hero{position:relative;background:linear-gradient(180deg,#F7FAF9 0%,#fff 100%);border-bottom:1px solid var(--line);overflow:hidden}
.hero-inner{position:relative;padding:76px 0 84px;text-align:center;max-width:760px;margin:0 auto}
.hero .watermark{position:absolute;inset-inline-end:-40px;top:-60px;font-family:var(--font-display);font-weight:800;font-size:420px;line-height:1;color:var(--teal);opacity:.055;pointer-events:none;user-select:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--teal-tint);color:var(--teal-dark);font-weight:600;font-size:13px;padding:6px 14px;border-radius:99px;margin-bottom:20px}
.eyebrow .dot{width:7px;height:7px;border-radius:99px;background:var(--teal)}
.hero h1{font-size:clamp(30px,5vw,50px);font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p.sub{color:var(--ink-soft);font-size:17px;max-width:560px;margin:0 auto 32px}
.search-bar{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;max-width:640px;margin:0 auto 22px;gap:8px}
.search-bar svg{flex:none;margin-inline-start:12px;color:var(--ink-soft)}
.search-bar input{flex:1;border:none;outline:none;font-size:15.5px;padding:10px 4px;background:transparent;min-width:0}
.hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-stats{display:flex;gap:36px;justify-content:center;margin-top:44px;flex-wrap:wrap}
.hero-stat{text-align:center}
.hero-stat b{display:block;font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--teal-dark)}
.hero-stat span{font-size:13px;color:var(--ink-soft)}

/* ---------- Sections ---------- */
section.block{padding:60px 0}
section.block.alt{background:var(--mist)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.section-head h2{font-size:26px;font-weight:700;letter-spacing:-.01em}
.section-head p{color:var(--ink-soft);font-size:14.5px;margin-top:4px}
.link-more{color:var(--teal);font-weight:600;font-size:14px;background:none;border:none;display:inline-flex;align-items:center;gap:6px}
.link-more:hover{text-decoration:underline}

/* Industry grid */
.industry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.industry-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:20px 14px;text-align:center;transition:border-color .15s,transform .15s;display:block;width:100%}
.industry-card:hover{border-color:var(--teal);transform:translateY(-2px)}
.industry-card .icon{width:46px;height:46px;border-radius:13px;background:var(--teal-tint);display:grid;place-items:center;font-size:22px;margin:0 auto 10px}
.industry-card .name{font-weight:600;font-size:13.5px;line-height:1.35}
.industry-card .count{font-size:12px;color:var(--ink-soft)}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.factory-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:box-shadow .15s,transform .15s;text-align:start;width:100%;padding:0}
.factory-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.factory-card .cover{height:104px;position:relative}
.factory-card .flogo{position:absolute;bottom:-22px;inset-inline-start:18px;width:52px;height:52px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--teal)}
.factory-card .body{padding:32px 18px 18px}
.factory-card h3{font-size:16px;font-weight:700;margin-bottom:2px}
.factory-card .meta{font-size:12.5px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.factory-card .desc{font-size:13px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;background:var(--mist);color:var(--ink-soft);padding:4px 10px;border-radius:99px}
.chip.teal{background:var(--teal-tint);color:var(--teal-dark)}
.chip.amber{background:#FBF1E2;color:#8A5A12}

/* Request cards */
.request-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;transition:box-shadow .15s,transform .15s;text-align:start;width:100%}
.request-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.request-card .thumb{height:120px;border-radius:12px;margin-bottom:14px;display:grid;place-items:center;font-size:34px}
.request-card h3{font-size:15.5px;font-weight:700;margin-bottom:4px}
.request-card .desc{font-size:13px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.request-card .foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap;gap:6px}

/* Why */
.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.why-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:22px}
.why-card .icon{width:42px;height:42px;border-radius:12px;background:var(--teal-tint);display:grid;place-items:center;font-size:20px;margin-bottom:14px}
.why-card h3{font-size:15.5px;font-weight:700;margin-bottom:6px}
.why-card p{font-size:13.5px;color:var(--ink-soft)}

/* CTA band */
.cta-band{background:var(--teal-dark);border-radius:22px;padding:44px 40px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden}
.cta-band .ain-bg{position:absolute;inset-inline-end:20px;top:-70px;font-family:var(--font-display);font-size:260px;font-weight:800;opacity:.08;line-height:1}
.cta-band h2{font-size:26px;font-weight:800;margin-bottom:6px}
.cta-band p{opacity:.85;font-size:14.5px;max-width:480px}
.cta-band .btn-primary{background:#fff;color:var(--teal-dark);box-shadow:none}

/* ---------- Directory page ---------- */
.page-head{background:var(--mist);border-bottom:1px solid var(--line);padding:34px 0}
.page-head h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.page-head p{color:var(--ink-soft);font-size:14.5px;margin-top:4px}
.dir-layout{display:grid;grid-template-columns:250px 1fr;gap:28px;padding:32px 0 64px;align-items:start}
.filters{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;position:sticky;top:84px}
.filters h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.filters .clear{font-size:12px;color:var(--teal);background:none;border:none;font-weight:600}
.f-group{margin-bottom:16px}
.f-group label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.f-group select,.f-group input[type=text],.f-group input[type=number]{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.f-check{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
.f-check input{accent-color:var(--teal);width:16px;height:16px}
.results-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.results-bar .count{font-size:13.5px;color:var(--ink-soft)}
.results-bar .count b{color:var(--ink)}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:34px;margin-bottom:10px}

/* ---------- Profile ---------- */
.profile-cover{height:220px;position:relative}
.profile-top{position:relative;margin-top:-46px}
.profile-card{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.profile-logo{width:84px;height:84px;border-radius:18px;background:var(--teal-tint);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--teal);flex:none}
.profile-main{flex:1;min-width:240px}
.profile-main h1{font-size:24px;font-weight:800;margin-bottom:4px}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.profile-layout{display:grid;grid-template-columns:1fr 320px;gap:24px;padding:28px 0 64px;align-items:start}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px}
.panel h2{font-size:16.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h2::before{content:"";width:4px;height:18px;border-radius:4px;background:var(--teal)}
.panel p{font-size:14px;color:var(--ink-soft)}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spec{background:var(--mist);border-radius:12px;padding:12px 14px}
.spec .k{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.spec .v{font-size:14px;font-weight:600;margin-top:2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gallery .ph{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;font-size:26px;color:#fff}
.contact-panel{position:sticky;top:84px}
.contact-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;font-weight:600;font-size:14px;transition:border-color .15s,background .15s;background:#fff;width:100%;text-align:start}
.contact-btn:hover{border-color:var(--teal);background:var(--teal-tint)}
.contact-btn .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.contact-btn small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
.back-btn{background:none;border:none;color:var(--teal);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;margin:20px 0 0}

/* ---------- Requests page & form ---------- */
.req-layout{padding:32px 0 64px}
.modal-backdrop{position:fixed;inset:0;background:rgba(21,34,31,.45);z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:20px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:28px}
.modal h2{font-size:20px;font-weight:800;margin-bottom:4px}
.modal .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:13px;font-weight:600}
.form-field label .opt{color:var(--ink-soft);font-weight:400;font-size:12px}
.form-field input,.form-field select,.form-field textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:11px}
.form-field textarea{resize:vertical;min-height:90px}
.upload-box{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink-soft);font-size:13px;background:var(--mist)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;box-shadow:var(--shadow)}
[dir="rtl"] .toast{transform:translateX(50%)}
.req-detail-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}

/* ---------- Footer ---------- */
footer{background:var(--ink);color:#B9C6C2;padding:48px 0 28px;margin-top:0}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;margin-bottom:32px}
footer .logo{color:#fff;margin-bottom:12px}
footer .logo .mark{background:var(--teal)}
footer p{font-size:13.5px;max-width:280px}
footer h4{color:#fff;font-size:13.5px;margin-bottom:12px;font-weight:700}
footer ul{list-style:none}
footer li{margin-bottom:8px;font-size:13.5px}
footer li button{background:none;border:none;color:#B9C6C2;font-size:13.5px;padding:0}
footer li button:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:20px;font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* ---------- Responsive ---------- */
@media(max-width:920px){
  .dir-layout{grid-template-columns:1fr}
  .filters{position:static}
  .profile-layout{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
  nav.main-nav{display:none}
}
@media(max-width:640px){
  .form-grid{grid-template-columns:1fr}
  .spec-grid{grid-template-columns:1fr}
  .hero-inner{padding:52px 0 60px}
  .cta-band{padding:32px 24px}
  .header-inner{gap:12px}
}
</style>
</head>

 {id:"r5",icon:"🎁",days:4,qty:"2,000",budget:"180,000",
  title:{en:"Corporate gift boxes for year-end campaign",ar:"علب هدايا شركات لحملة نهاية العام"},
  desc:{en:"2,000 gift sets: rigid box, branded ceramic mug, A5 notebook, and pen — all with single-color logo. Needed before December 10.",ar:"٢٠٠٠ طقم هدايا: علبة هارد، مج سيراميك بشعار، نوت بوك A5، وقلم — بطباعة لون واحد. مطلوب قبل ١٠ ديسمبر."},
  material:{en:"Rigid board, ceramic, PU",ar:"كرتون مقوى، سيراميك، جلد صناعي"},

 {id:"r6",icon:"🩺",days:6,qty:"100,000",budget:null,
  title:{en:"Disposable non-woven gowns — export order",ar:"أرواب غير منسوجة للاستخدام الواحد — طلب تصدير"},
  desc:{en:"Export trading office seeks a certified factory for 100k SMS non-woven gowns (35 gsm, EN 13795). CE marking required. Recurring quarterly volumes.",ar:"مكتب تصدير يبحث عن مصنع معتمد لتوريد ١٠٠ ألف روب SMS غير منسوج (٣٥ جم، مطابق EN 13795) بعلامة CE. كميات ربع سنوية متكررة."},
  material:{en:"SMS non-woven 35 gsm",ar:"قماش SMS غير منسوج ٣٥ جم"},
  gov:3, by:{en:"PortEx Trading",ar:"بورت إكس للتصدير"}, contact:"+20 114 652 9903 · portex@trade.example"}
];
</script>
<script>
/* =============== App state & helpers =============== */
let LANG=document.documentElement.getAttribute("data-lang")||"ar";
let VIEW={name:"home"};
let FILTERS={q:"",industry:"",gov:"",moq:"",exp:false,sort:"name"};
const t=k=>STR[LANG][k];
const L=obj=>obj[LANG];
const ind=id=>INDUSTRIES.find(x=>x.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const grad=g=>`linear-gradient(135deg,${g[0]},${g[1]})`;
const num=n=>LANG==="ar"?Number(String(n).replace(/,/g,"")).toLocaleString("ar-EG"):Number(String(n).replace(/,/g,"")).toLocaleString("en-US");

function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.documentElement.dir=l==="ar"?"rtl":"ltr";
  render();
}
function go(view){ VIEW=view; render(); window.scrollTo({top:0}); }
function toast(msg){
  const el=document.createElement("div");
  el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

/* =============== Shared pieces =============== */
function headerHTML(){
  const links=[["home",t("nav_home")],["factories",t("nav_factories")],["requests",t("nav_requests")]];
  return `<header><div class="container header-inner">
    <a href="#" class="logo" onclick="go({name:'home'});return false">
      <span class="mark">ع</span><span>${t("brand")}<span class="ain">ع</span></span>
    </a>
    <nav class="main-nav">${links.map(([v,l])=>`<button class="nav-link ${VIEW.name===v||VIEW.name===v.slice(0,-1)?"active":""}" onclick="go({name:'${v}'})">${l}</button>`).join("")}</nav>
    <div class="header-actions">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button class="${LANG==='en'?'on':''}" onclick="setLang('en')">EN</button>
        <button class="${LANG==='ar'?'on':''}" onclick="setLang('ar')">عربي</button>
      </div>
      <button class="btn btn-ghost btn-sm">${t("login")}</button>
      <button class="btn btn-primary btn-sm" onclick="openForm()">${t("post_request")}</button>
    </div>
  </div></header>`;
}
function footerHTML(){
  const col=(title,items)=>`<div><h4>${title}</h4><ul>${items.map(x=>`<li><button>${x}</button></li>`).join("")}</ul></div>`;
  return `<footer><div class="container">
    <div class="footer-grid">
      <div><div class="logo"><span class="mark">ع</span><span>${t("brand")}<span class="ain" style="color:#4FBFAE">ع</span></span></div>
      <p>${t("footer_about")}</p></div>
      ${col(t("f_platform"),t("f_links1"))}${col(t("f_company"),t("f_links2"))}${col(t("f_support"),t("f_links3"))}
    </div>
    <div class="footer-bottom"><span>${t("rights")}</span><span>${t("made")}</span></div>
  </div></footer>`;
}
function factoryCardHTML(f){
  const i=ind(f.industry);
  return `<button class="factory-card" onclick="go({name:'factory',id:'${f.id}'})">
    <div class="cover" style="background:${grad(i.g)}">
      <div class="flogo">${L(f.name).charAt(0)}</div>
    </div>
    <div class="body">
      <h3>${esc(L(f.name))}</h3>
      <div class="meta"><span>${i.icon} ${L({en:i.en,ar:i.ar})}</span> · <span>📍 ${L(f.gov)}</span></div>
      <div class="desc">${esc(L(f.desc))}</div>
      <div class="chip-row">
        <span class="chip teal">${t("moq")}: ${num(f.moq)}</span>
        ${f.exp?`<span class="chip amber">🌍 ${t("exports")}</span>`:""}
        ${f.certs.slice(0,1).map(c=>`<span class="chip">${c}</span>`).join("")}
      </div>
    </div>
  </button>`;
}
function requestCardHTML(r){
  const i=INDUSTRIES[0];
  return `<button class="request-card" onclick="go({name:'request',id:'${r.id}'})">
    <div class="thumb" style="background:var(--mist)">${r.icon}</div>
    <h3>${esc(L(r.title))}</h3>
    <div class="desc">${esc(L(r.desc))}</div>
    <div class="foot">
      <span>📦 ${t("qty")}: <b>${num(r.qty)}</b></span>
      <span>📍 ${L(GOVS[r.gov])}</span>
      <span>🕒 ${STR[LANG].days_ago(r.days)}</span>
    </div>
  </button>`;
}

/* =============== Views =============== */
function homeHTML(){
  const featured=FACTORIES.filter(f=>f.featured);
  return `
  <div class="hero"><div class="container hero-inner">
    <div class="watermark" aria-hidden="true">ع</div>
    <span class="eyebrow"><span class="dot"></span>${t("eyebrow")}</span>
    <h1>${t("hero_title")}</h1>
    <p class="sub">${t("hero_sub")}</p>
    <form class="search-bar" onsubmit="event.preventDefault();FILTERS.q=this.q.value;go({name:'factories'})">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input name="q" placeholder="${t("search_ph")}" aria-label="${t("search_ph")}">
      <button class="btn btn-primary" type="submit">${LANG==='ar'?'بحث':'Search'}</button>
    </form>
    <div class="hero-ctas">
      <button class="btn btn-ghost" onclick="go({name:'factories'})">🏭 ${t("browse_factories")}</button>
      <button class="btn btn-primary" onclick="openForm()">📣 ${t("post_request")}</button>
    </div>
    <div class="hero-stats">
      <div class="hero-stat"><b>${num(50)}+</b><span>${t("stat_factories")}</span></div>
      <div class="hero-stat"><b>${num(14)}</b><span>${t("stat_industries")}</span></div>
      <div class="hero-stat"><b>${num(16)}</b><span>${t("stat_governorates")}</span></div>
    </div>
  </div></div>

  <section class="block"><div class="container">
    <div class="section-head"><div><h2>${t("industries_title")}</h2><p>${t("industries_sub")}</p></div></div>
    <div class="industry-grid">
      ${INDUSTRIES.map(i=>{
        const c=FACTORIES.filter(f=>f.industry===i.id).length;
        return `<button class="industry-card" onclick="FILTERS={...FILTERS,industry:'${i.id}'};go({name:'factories'})">
          <div class="icon">${i.icon}</div><div class="name">${L({en:i.en,ar:i.ar})}</div>
          <div class="count">${num(c)} ${t("factories_count")}</div></button>`;
      }).join("")}
    </div>
  </div></section>

  <section class="block alt"><div class="container">
    <div class="section-head"><div><h2>${t("latest_requests")}</h2><p>${t("latest_requests_sub")}</p></div>
      <button class="link-more" onclick="go({name:'requests'})">${t("view_all")} ${LANG==='ar'?'←':'→'}</button></div>
    <div class="card-grid">${REQUESTS.slice(0,3).map(requestCardHTML).join("")}</div>
  </div></section>

  <section class="block"><div class="container">
    <div class="section-head"><div><h2>${t("featured")}</h2><p>${t("featured_sub")}</p></div>
      <button class="link-more" onclick="go({name:'factories'})">${t("view_all")} ${LANG==='ar'?'←':'→'}</button></div>
    <div class="card-grid">${featured.map(factoryCardHTML).join("")}</div>
  </div></section>

  <section class="block alt"><div class="container">
    <div class="section-head"><div><h2>${t("why_title")}</h2></div></div>
    <div class="why-grid">
      ${t("why").map(([ic,h,p])=>`<div class="why-card"><div class="icon">${ic}</div><h3>${h}</h3><p>${p}</p></div>`).join("")}
    </div>
  </div></section>

  <section class="block"><div class="container">
    <div class="cta-band">
      <div class="ain-bg" aria-hidden="true">ع</div>
      <div><h2>${t("cta_title")}</h2><p>${t("cta_sub")}</p></div>
      <button class="btn btn-primary">${t("cta_btn")}</button>
    </div>
  </div></section>`;
}

function factoriesHTML(){
  let list=FACTORIES.filter(f=>{
    if(FILTERS.industry && f.industry!==FILTERS.industry) return false;
    if(FILTERS.gov!=="" && FILTERS.gov!=null && f.gov!==GOVS[FILTERS.gov]) return false;
    if(FILTERS.moq && f.moq>Number(FILTERS.moq)) return false;
    if(FILTERS.exp && !f.exp) return false;
    if(FILTERS.q){
      const q=FILTERS.q.toLowerCase();
      const i=ind(f.industry);
      const hay=[f.name.en,f.name.ar,i.en,i.ar,f.gov.en,f.gov.ar,...IND_PRODUCTS[f.industry].en,...IND_PRODUCTS[f.industry].ar,...IND_CAPS[f.industry].en,...IND_CAPS[f.industry].ar].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(FILTERS.sort==="moq") list=[...list].sort((a,b)=>a.moq-b.moq);
  else list=[...list].sort((a,b)=>L(a.name).localeCompare(L(b.name),LANG));

  return `
  <div class="page-head"><div class="container"><h1>${t("dir_title")}</h1><p>${t("dir_sub")}</p></div></div>
  <div class="container dir-layout">
    <aside class="filters">
      <h3>${t("filters")} <button class="clear" onclick="FILTERS={q:'',industry:'',gov:'',moq:'',exp:false,sort:'name'};render()">${t("clear")}</button></h3>
      <div class="f-group"><label>${LANG==='ar'?'بحث':'Search'}</label>
        <input type="text" value="${esc(FILTERS.q)}" onchange="FILTERS.q=this.value;render()" placeholder="${t("search_ph")}"></div>
      <div class="f-group"><label>${t("f_industry")}</label>
        <select onchange="FILTERS.industry=this.value;render()">
          <option value="">${t("all")}</option>
          ${INDUSTRIES.map(i=>`<option value="${i.id}" ${FILTERS.industry===i.id?"selected":""}>${L({en:i.en,ar:i.ar})}</option>`).join("")}
        </select></div>
      <div class="f-group"><label>${t("f_gov")}</label>
        <select onchange="FILTERS.gov=this.value;render()">
          <option value="">${t("all")}</option>
          ${GOVS.map((g,ix)=>`<option value="${ix}" ${String(FILTERS.gov)===String(ix)?"selected":""}>${L(g)}</option>`).join("")}
        </select></div>
      <div class="f-group"><label>${t("f_moq")}</label>
        <input type="number" min="0" value="${esc(FILTERS.moq)}" onchange="FILTERS.moq=this.value;render()" placeholder="${LANG==='ar'?'مثال: ٥٠٠':'e.g. 500'}"></div>
      <div class="f-group"><label class="f-check"><input type="checkbox" ${FILTERS.exp?"checked":""} onchange="FILTERS.exp=this.checked;render()"> ${t("f_export")}</label></div>
    </aside>
    <div>
      <div class="results-bar">
        <span class="count"><b>${num(list.length)}</b> ${t("results")}</span>
        <label style="font-size:13px;color:var(--ink-soft)">${t("sort")}:
          <select style="padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;margin-inline-start:6px" onchange="FILTERS.sort=this.value;render()">
            <option value="name" ${FILTERS.sort==="name"?"selected":""}>${t("sort_name")}</option>
            <option value="moq" ${FILTERS.sort==="moq"?"selected":""}>${t("sort_moq")}</option>
          </select></label>
      </div>
      ${list.length?`<div class="card-grid">${list.map(factoryCardHTML).join("")}</div>`
        :`<div class="empty"><div class="big">🔍</div><b>${t("no_results")}</b><p>${t("no_results_sub")}</p></div>`}
    </div>
  </div>`;
}

function factoryProfileHTML(id){
  const f=FACTORIES.find(x=>x.id===id); if(!f) return homeHTML();
  const i=ind(f.industry);
  const prods=IND_PRODUCTS[f.industry], caps=IND_CAPS[f.industry];
  const cIcon=(bg,em)=>`<span class="ci" style="background:${bg}">${em}</span>`;
  const slug=f.name.en.toLowerCase().replace(/[^a-z]+/g,"");
  return `
  <div class="container"><button class="back-btn" onclick="go({name:'factories'})">${LANG==='ar'?'→':'←'} ${t("back")}</button></div>
  <div class="container" style="margin-top:14px">
    <div class="profile-cover" style="background:${grad(i.g)};border-radius:20px"></div>
    <div class="profile-top">
      <div class="profile-card">
        <div class="profile-logo">${L(f.name).charAt(0)}</div>
        <div class="profile-main">
          <h1>${esc(L(f.name))}</h1>
          <div class="meta" style="color:var(--ink-soft);font-size:13.5px">${i.icon} ${L({en:i.en,ar:i.ar})} · 📍 ${L(f.gov)} · ${t("est")} ${num(f.yr)}</div>
          <div class="badge-row">
            <span class="chip teal">${t("moq")}: ${num(f.moq)} ${t("units")}</span>
            ${f.exp?`<span class="chip amber">🌍 ${t("exports")}</span>`:""}
            ${f.certs.map(c=>`<span class="chip">✔ ${c}</span>`).join("")}
          </div>
        </div>
      </div>
    </div>
    <div class="profile-layout">
      <div>
        <div class="panel"><h2>${t("about")}</h2><p>${esc(L(f.desc))}</p></div>
        <div class="panel"><h2>${t("products")}</h2>
          <div class="chip-row">${L(prods).map(p=>`<span class="chip" style="font-size:13px;padding:7px 14px">${p}</span>`).join("")}</div></div>
        <div class="panel"><h2>${t("capabilities")}</h2>
          <div class="chip-row">${L(caps).map(p=>`<span class="chip teal" style="font-size:13px;padding:7px 14px">${p}</span>`).join("")}</div></div>
        <div class="panel"><h2>${t("gallery")}</h2>
          <div class="gallery">${[0,1,2,3,4,5].map(n=>`<div class="ph" style="background:${grad(i.g)};opacity:${1-n*0.09}">${n<3?"📷":i.icon}</div>`).join("")}</div></div>
        <div class="panel"><h2>${t("details")}</h2>
          <div class="spec-grid">
            <div class="spec"><div class="k">${t("established")}</div><div class="v">${num(f.yr)}</div></div>
            <div class="spec"><div class="k">${t("employees")}</div><div class="v">${f.emp}</div></div>
            <div class="spec"><div class="k">${t("location")}</div><div class="v">📍 ${L(f.gov)}</div></div>
            <div class="spec"><div class="k">${t("hours")}</div><div class="v">${t("hours_val")}</div></div>
            <div class="spec"><div class="k">${t("moq")}</div><div class="v">${num(f.moq)} ${t("units")}</div></div>
            <div class="spec"><div class="k">${t("certifications")}</div><div class="v">${f.certs.length?f.certs.join(" · "):"—"}</div></div>
          </div></div>
      </div>
      <aside class="contact-panel">
        <div class="panel">
          <h2>${t("contact_title")}</h2>
          <p style="margin-bottom:14px;font-size:13px">${t("contact_sub")}</p>
          <a class="contact-btn" href="tel:${f.phone.replace(/\s/g,'')}">${cIcon("var(--teal-tint)","📞")}<span>${t("call")}<small dir="ltr">${f.phone}</small></span></a>
          <a class="contact-btn" href="#" onclick="return false">${cIcon("#E7F6EC","💬")}<span>${t("whatsapp")}<small dir="ltr">${f.phone}</small></span></a>
          <a class="contact-btn" href="mailto:info@${slug}.example">${cIcon("#FDF0E0","✉️")}<span>${t("email")}<small dir="ltr">info@${slug}.example</small></span></a>
          <a class="contact-btn" href="#" onclick="return false">${cIcon("#E8EEFB","🌐")}<span>${t("website")}<small dir="ltr">${slug}.example.com</small></span></a>
          <div class="chip-row" style="margin-top:8px">
            <span class="chip">Facebook</span><span class="chip">Instagram</span><span class="chip">LinkedIn</span>
          </div>
        </div>
      </aside>
    </div>
  </div>`;
}

function requestsHTML(){
  return `
  <div class="page-head"><div class="container" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
    <div><h1>${t("req_title")}</h1><p>${t("req_sub")}</p></div>
    <button class="btn btn-primary" onclick="openForm()">📣 ${t("post_request")}</button>
  </div></div>
  <div class="container req-layout"><div class="card-grid">${REQUESTS.map(requestCardHTML).join("")}</div></div>`;
}

function requestDetailHTML(id){
  const r=REQUESTS.find(x=>x.id===id); if(!r) return requestsHTML();
  return `
  <div class="container"><button class="back-btn" onclick="go({name:'requests'})">${LANG==='ar'?'→':'←'} ${t("req_title")}</button></div>
  <div class="container" style="padding:18px 24px 64px;max-width:860px">
    <div class="panel">
      <div class="req-detail-head">

        <h2>${t("contact_requester")}</h2>
        <p style="font-weight:600;color:var(--ink)" dir="ltr">${esc(r.contact)}</p>

/* =============== Request form =============== */
function openForm(){
  const bd=document.createElement("div");
  bd.className="modal-backdrop";
  bd.addEventListener("click",e=>{if(e.target===bd)bd.remove()});
  bd.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <h2>${t("new_req")}</h2><p class="sub">${t("new_req_sub")}</p>
    <div class="form-grid">
      <div class="form-field full"><label>${t("fr_title")} *</label><input id="fq_title" placeholder="${t("fr_title_ph")}"></div>
      <div class="form-field full"><label>${t("fr_desc")} *</label><textarea id="fq_desc" placeholder="${t("fr_desc_ph")}"></textarea></div>
      <div class="form-field"><label>${t("fr_qty")} *</label><input id="fq_qty" type="number" min="1" placeholder="1000"></div>
      <div class="form-field"><label>${t("fr_material")} <span class="opt">(${t("optional")})</span></label><input id="fq_mat" placeholder="${t("fr_material_ph")}"></div>
      <div class="form-field"><label>${t("fr_budget")} <span class="opt">(${t("optional")})</span></label><input id="fq_budget" type="number" min="0" placeholder="${t("fr_budget_ph")}"></div>
      <div class="form-field"><label>${t("fr_gov")} *</label>
        <select id="fq_gov">${GOVS.map((g,ix)=>`<option value="${ix}">${L(g)}</option>`).join("")}</select></div>
      <div class="form-field full"><label>${t("fr_contact")} *</label><input id="fq_contact" placeholder="${t("fr_contact_ph")}"></div>
      <div class="form-field full"><label>${t("fr_files")} <span class="opt">(${t("optional")})</span></label>
        <div class="upload-box">${t("fr_files_note")}</div></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="fq_cancel">${t("cancel")}</button>
      <button class="btn btn-primary" id="fq_submit">${t("publish")}</button>
    </div>
  </div>`;
  document.body.appendChild(bd);
  bd.querySelector("#fq_cancel").onclick=()=>bd.remove();
  bd.querySelector("#fq_submit").onclick=()=>{
    const v=id=>bd.querySelector(id).value.trim();
    const title=v("#fq_title"),desc=v("#fq_desc"),qty=v("#fq_qty"),contact=v("#fq_contact");
    if(!title||!desc||!qty||!contact){toast(t("fill_required"));return;}
    const mat=v("#fq_mat")||"—", budget=v("#fq_budget")||null, gov=Number(bd.querySelector("#fq_gov").value);
    REQUESTS.unshift({id:"r"+Date.now(),icon:"📝",days:0,qty,budget,
      title:{en:title,ar:title},desc:{en:desc,ar:desc},material:{en:mat,ar:mat},
      gov,by:{en:LANG==='ar'?"مستخدم صُنّاع":"Sonnaع user",ar:"مستخدم صُنّاع"},contact});
    bd.remove(); toast(t("published")); go({name:"requests"});
  };
}

/* =============== Render =============== */
function render(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
  let body="";
  if(VIEW.name==="home")body=homeHTML();
  else if(VIEW.name==="factories")body=factoriesHTML();
  else if(VIEW.name==="factory")body=factoryProfileHTML(VIEW.id);
  else if(VIEW.name==="requests")body=requestsHTML();
  else if(VIEW.name==="request")body=requestDetailHTML(VIEW.id);
  document.getElementById("app").innerHTML=
    headerHTML()+`<main>${body}</main>`+
    `<div class="container" style="padding:0 24px 28px"><p style="font-size:12px;color:var(--ink-soft);text-align:center">${t("demo_note")}</p></div>`+
    footerHTML();
}
render();
</script>
</body>
</html>
