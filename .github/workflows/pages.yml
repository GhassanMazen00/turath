name: Deploy تُراث to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # إيداعات GitHub Actions لا تُشغِّل سواها من العمليات (منعًا للتسلسل اللانهائي)،
  # فلولا هذا لبقي ما يجلبه عملُ الشروح في المستودع دون أن يُنشر.
  workflow_run:
    workflows: ["جلب شروح الأحاديث"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
