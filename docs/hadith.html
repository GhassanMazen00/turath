<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"></noscript>

<script>(function(){var t=localStorage.getItem("turath-theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
<title>$1</title></head><body>
<header class="nav"><div class="navin">

  <nav class="navl"><a href="tafsir.html"$2>التفسير</a><a href="hadith.html"$3>الحديث</a><a href="rijal.html"$4>الرواة</a>
  <span id="mnw"></span><span id="tg"></span></nav>
</div></header>
<div class="shell"><aside class="side" id="side"></aside><main class="main" id="app"></main></div>
<script src="assets/app.js"></script>
<script>
theme(); document.getElementById('tg').innerHTML=TGL; document.getElementById('mnw').innerHTML=MENU;
mountMenu(document.getElementById('mn'),document.getElementById('side'));
const PER=15; let B={},TAK={},GDEF={},SHARH={};
const app=()=>document.getElementById('app'), side=()=>document.getElementById('side');
const FOOT='<footer class="foot" id="foot"></footer>';
function foot(){const f=document.getElementById('foot'); if(f)mountFooter(f);}
(async()=>{ try{ await searchInit(); B=SEARCH.books;
    const [tk,gd,sh,shm]=await Promise.all([api.local('takhrij.json').catch(()=>({})),
      api.local('grades.json').catch(()=>({})),api.local('sharh.json').catch(()=>({})),
      api.local('sharh-manual.json').catch(()=>({}))]);
    TAK=tk; GDEF=gd;
    // اليدويّ يعلو على المجلوب آليًّا؛ ومفاتيح الدليل تُتخطّى
    SHARH=Object.assign({},sh);
    for(const k in shm){ if(k.charAt(0)==='_')continue; SHARH[k]=shm[k]; }
  }catch(e){ return failed(app(),e); }
  addEventListener('hashchange',route); route(); })();
function route(){
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(!p.length) return vBooks();
  if(p[1]==='h') return vHadith(p[0],+p[2]);
  if(p.length===1) return vSections(p[0]);
  return vList(p[0],+p[1],+(p[2]||1));
}
function sideBooks(a){sidebar(side(),{title:'كتب الحديث',active:a,
  items:Object.keys(B).map(k=>({key:k,href:'#/'+k,label:B[k].ar,side:AR(B[k].total)}))});}
function sideSections(k,a){const b=B[k];sidebar(side(),{title:b.ar,active:a,
  items:b.sections.map(s=>({key:s.n,href:'#/'+k+'/'+s.n+'/1',n:s.n,label:s.ar,side:AR(s.count)}))});}
function vBooks(){
  sideBooks(); const tot=Object.values(B).reduce((a,b)=>a+b.total,0);
  app().innerHTML='<nav class="crumb"><span>كتب الحديث</span></nav>'+
   '<div class="ph"><div class="k">السنّة النبوية</div><h1>كتب الحديث</h1>'+
   '<div class="m"><bdi>'+AR(Object.keys(B).length)+' كتب</bdi><span class="sep">•</span><bdi>'+AR(tot)+' حديثًا</bdi></div></div>'+
   '<div id="s"></div><div class="sh"><h2>الكتب</h2><span class="ln"></span></div>'+
   '<div class="bento">'+Object.keys(B).map(k=>{const b=B[k];
     return '<a class="cell b3 card" href="#/'+k+'"><div class="ch"><h3>'+esc(b.ar)+'</h3>'+
     '<span class="cn"><bdi>'+AR(b.total)+'</bdi><small>حديثًا</small></span></div>'+
     '<p class="au">'+esc(b.author)+'</p>'+
     (BOOKNOTE[k]?'<p>'+esc(BOOKNOTE[k])+'</p>':'')+
     '<div class="meta"><bdi>'+AR(b.sections.length)+' كتابًا وبابًا</bdi>'+
     '<span class="go">تصفَّح ←</span></div></a>';}).join('')+'</div>'+FOOT;
  mountSearch(document.getElementById('s'),{}); foot(); scrollTo(0,0);
}
function vSections(k){
  const b=B[k]; if(!b) return vBooks(); sideSections(k);
  app().innerHTML='<nav class="crumb"><a href="#/">كتب الحديث</a><span class="sep">›</span><span>'+esc(b.ar)+'</span></nav>'+
   '<div class="ph"><div class="k">'+esc(b.author)+'</div><h1>'+esc(b.ar)+'</h1>'+
   '<div class="m"><bdi>'+AR(b.total)+' حديثًا</bdi><span class="sep">•</span><bdi>'+AR(b.sections.length)+' كتابًا</bdi></div></div>'+
   '<div class="sh"><h2>الكتب والأبواب</h2><span class="ln"></span></div>'+
   '<div class="tiles">'+b.sections.map(s=>
     '<a class="tile wrap" href="#/'+k+'/'+s.n+'/1"><span class="n">'+AR(s.n)+'</span>'+
     '<span class="t"><b>'+esc(s.ar)+'</b><span><bdi>'+AR(s.count)+' حديثًا</bdi></span></span></a>').join('')+'</div>'+FOOT;
  foot(); scrollTo(0,0);
}
async function vList(k,sec,page){
  const b=B[k]; if(!b) return vBooks();
  const s=b.sections.find(x=>x.n===sec); if(!s) return vSections(k);
  sideSections(k,sec);
  app().innerHTML='<nav class="crumb"><a href="#/">كتب الحديث</a><span class="sep">›</span><a href="#/'+k+'">'+esc(b.ar)+'</a><span class="sep">›</span><span>'+esc(s.ar)+'</span></nav>'+
   '<div class="ph"><div class="k">'+esc(b.ar)+'</div><h1>'+esc(s.ar)+'</h1>'+
   '<div class="m"><bdi>'+AR(s.count)+' حديثًا</bdi></div></div><div id="body"></div>'+FOOT;
  loading(document.getElementById('body'),'جارٍ الجلب…'); foot(); scrollTo(0,0);
  try{
    const idx=await loadIdx(k); const rows=idx.filter(r=>r[1]===sec);
    const pages=Math.max(1,Math.ceil(rows.length/PER)); page=Math.min(Math.max(1,page),pages);
    const pg=()=>{const pv=page>1?'#/'+k+'/'+sec+'/'+(page-1):null,nx=page<pages?'#/'+k+'/'+sec+'/'+(page+1):null;
      return '<div class="pager">'+(pv?'<a href="'+pv+'">‹ السابق</a>':'<span class="off">‹ السابق</span>')+
      '<span class="mid"><bdi>صفحة '+AR(page)+' من '+AR(pages)+'</bdi></span>'+
      (nx?'<a href="'+nx+'">التالي ›</a>':'<span class="off">التالي ›</span>')+'</div>';};

    // نصّ الباب كما ورد بالتشكيل — الفهرس المحلّي مطبَّعٌ للمطابقة لا للعرض
    let orig={};
    try{ const sd=await api.section(k,sec);
      for(const h of (sd.hadiths||[])) orig[h.hadithnumber]=h.text;
    }catch(e){}
    const show=(num,txt)=>{const t=orig[num]||txt;
      return esc(t.length>230?t.slice(0,230)+'…':t);};
    document.getElementById('body').innerHTML=pg()+rows.slice((page-1)*PER,page*PER).map(([num,,txt,g])=>{
      const gg=g&&g.length?'<span class="g '+gclass(g[0][1])+'">'+esc(g[0][1])+'</span>':'';
      const tk=(TAK[k+':'+num]||[]).length;
      return '<a class="hit" href="#/'+k+'/h/'+num+'"><div class="m"><span class="tag c">حديث '+AR(num)+'</span>'+gg+
        (tk?'<span class="tag"><bdi>'+AR(tk)+' تخريجًا</bdi></span>':'')+'</div>'+
        '<div class="tx">'+show(num,txt)+'</div></a>';}).join('')+pg();
  }catch(e){ failed(document.getElementById('body'),e); }
}
function gdef(g){
  if(!g)return'';
  const keys=Object.keys(GDEF).sort((a,b)=>b.length-a.length);
  for(const k of keys) if(g.indexOf(k)>=0) return GDEF[k];
  return'';
}
async function vHadith(k,num){
  const b=B[k]; if(!b) return vBooks();
  app().innerHTML='<div id="body"></div>'+FOOT;
  loading(document.getElementById('body'),'جارٍ جلب الحديث…'); foot(); scrollTo(0,0);
  try{
    const idx=await loadIdx(k); const row=idx.find(r=>r[0]===num);
    const sec=row?b.sections.find(x=>x.n===row[1]):null;
    if(sec) sideSections(k,sec.n); else sideBooks(k);
    const d=await api.hadith(k,num); const h=d.hadiths[0];
    const sp=splitIsnad(h.text), grades=row?row[3]:[], raw=(row&&row[4])||[];
    const RI=await rijalIndex();
    const all=idx.map(r=>r[0]),i=all.indexOf(num);
    const prev=i>0?all[i-1]:null,next=i>=0&&i<all.length-1?all[i+1]:null;
    const pg='<div class="pager">'+(prev?'<a href="#/'+k+'/h/'+prev+'">‹ حديث '+AR(prev)+'</a>':'<span class="off">‹</span>')+
      '<span class="mid"><bdi>حديث '+AR(num)+' من '+AR(b.total)+'</bdi></span>'+
      (next?'<a href="#/'+k+'/h/'+next+'">حديث '+AR(next)+' ›</a>':'<span class="off">›</span>')+'</div>';
    const auth=raw.length&&raw[0][0]==='i';
    const nodes=raw.map(([kind,v])=>{
      if(kind==='i'){const r=RI[v];return r?{href:'rijal.html#/r/'+encodeURIComponent(v),name:r.n,
        sub:[r.g,genAr(r.gen)].filter(Boolean).join(' — ')}:null;}
      return {href:'rijal.html#/r/'+encodeURIComponent('t:'+v),name:v,sub:''};}).filter(Boolean);
    const tak=TAK[k+':'+num]||[];
    const sharh=SHARH[k+':'+num];
    // الحكم البارز
    const top=grades.length?grades[0]:null;
    const cls=top?gclass(top[1]):'na';
    const agree=grades.filter(g=>gclass(g[1])===cls).length;
    const gband=top?
      '<div class="pane gband"><span class="gbig '+cls+'">'+esc(top[1])+'</span>'+
      '<span class="gdef">'+(gdef(top[1])||'حكمٌ منقول عن أهل الحديث.')+
      '<br><b>'+esc(top[0])+'</b>'+(grades.length>1?' — ووافقه <bdi>'+AR(agree-1)+'</bdi> من <bdi>'+AR(grades.length-1)+'</bdi> من المحدّثين الآخرين المذكورين':'')+'</span></div>'
      :'<div class="pane gband"><span class="gbig na">بلا حكم مرفق</span><span class="gdef">لم يرد حكم في المصدر لهذا الحديث'+
       ((k==='bukhari'||k==='muslim')?' — وهو من الصحيحين، وأهل العلم على تلقّي ما فيهما بالقبول.':'.')+'</span></div>';
    // ── الرفّ الجانبي ──
    const first=nodes.length?nodes[0]:null, last=nodes.length?nodes[nodes.length-1]:null;
    const rail=
      '<aside class="rail">'+
        '<div class="rc glass"><h4>الموضع</h4><dl>'+
          '<dt>الكتاب</dt><dd>'+esc(b.ar)+'</dd>'+
          (sec?'<dt>الباب</dt><dd>'+esc(sec.ar)+'</dd>':'')+
          '<dt>رقم الحديث</dt><dd><bdi>'+AR(num)+'</bdi></dd>'+
          '<dt>الموضع المطبوع</dt><dd><bdi>'+AR(h.reference.book)+':'+AR(h.reference.hadith)+'</bdi></dd>'+
        '</dl></div>'+
        (nodes.length?'<div class="rc glass"><h4>الإسناد</h4><dl>'+
          '<dt>عدد الرواة</dt><dd><bdi>'+AR(nodes.length)+'</bdi></dd>'+
          (last?'<dt>الصحابي</dt><dd>'+esc(last.name)+'</dd>':'')+
          (first?'<dt>شيخ المصنِّف</dt><dd>'+esc(first.name)+'</dd>':'')+
        '</dl></div>':'')+
        (grades.length?'<div class="rc glass"><h4>من حكم عليه</h4><div class="lnk">'+
          grades.slice(0,6).map(g=>'<a href="#" onclick="return showTab(\'hukm\')"><span>'+esc(g[0])+'</span>'+
            '<span class="g '+gclass(g[1])+'">'+esc(g[1])+'</span></a>').join('')+
          (grades.length>6?'<a href="#" onclick="return showTab(\'hukm\')"><span>وآخرون</span><span class="n">'+AR(grades.length-6)+'</span></a>':'')+
          '</div></div>':'')+
        (tak.length?'<div class="rc glass"><h4>أخرجه أيضًا</h4><div class="lnk">'+
          tak.map(r=>{const [bb,nn]=r.split(':');
            return '<a href="#/'+bb+'/h/'+nn+'"><span>'+esc((B[bb]||{}).ar||bb)+'</span><span class="n">'+AR(nn)+'</span></a>';}).join('')+
          '</div></div>':'')+
        '<div class="rc glass"><h4>تصفّح</h4><div class="lnk">'+
          (prev?'<a href="#/'+k+'/h/'+prev+'"><span>الحديث السابق</span><span class="n">'+AR(prev)+'</span></a>':'')+
          (next?'<a href="#/'+k+'/h/'+next+'"><span>الحديث التالي</span><span class="n">'+AR(next)+'</span></a>':'')+
          (sec?'<a href="#/'+k+'/'+sec.n+'/1"><span>كل أحاديث الباب</span><span class="n">'+AR(sec.count)+'</span></a>':'')+
          '<a href="#/'+k+'"><span>أبواب '+esc(b.ar)+'</span><span class="n">'+AR(b.sections.length)+'</span></a>'+
        '</div></div>'+
      '</aside>';
    document.getElementById('body').innerHTML=
      '<nav class="crumb"><a href="#/">كتب الحديث</a><span class="sep">›</span><a href="#/'+k+'">'+esc(b.ar)+'</a>'+
      (sec?'<span class="sep">›</span><a href="#/'+k+'/'+sec.n+'/1">'+esc(sec.ar)+'</a>':'')+
      '<span class="sep">›</span><span>حديث '+AR(num)+'</span></nav>'+pg+
      '<div class="ph"><div class="k">'+esc(b.ar)+(sec?' — '+esc(sec.ar):'')+'</div>'+
      '<h1>حديث '+AR(num)+'</h1><div class="m">'+esc(b.author)+
      '<span class="sep">•</span>الموضع <bdi>'+AR(h.reference.book)+':'+AR(h.reference.hadith)+'</bdi></div></div>'+
      '<div class="dual"><div class="dcol">'+
      gband+
      '<div class="pane matn"><span>'+esc(sp.matn||h.text)+'</span></div>'+
      '<div class="tabs" role="tablist">'+
        '<button class="tab" role="tab" data-t="isnad" aria-selected="true">الإسناد<span class="c">'+AR(nodes.length)+'</span></button>'+
        '<button class="tab" role="tab" data-t="full" aria-selected="false">النصّ كاملًا</button>'+
        '<button class="tab" role="tab" data-t="hukm" aria-selected="false">الأحكام<span class="c">'+AR(grades.length)+'</span></button>'+
        '<button class="tab" role="tab" data-t="takh" aria-selected="false">التخريج<span class="c">'+AR(tak.length)+'</span></button>'+
        '<button class="tab" role="tab" data-t="sharh" aria-selected="false">الشرح</button>'+
      '</div>'+
      '<div class="panel on" data-p="isnad">'+
        (nodes.length?'<div class="pane pad">'+nodes.map((n,j)=>{
          const role=j===0?'شيخ المصنِّف':(j===nodes.length-1?'الصحابي':'راوٍ');
          return '<div class="node'+(j===nodes.length-1?' last':'')+'">'+
          '<span class="dot">'+AR(j+1)+'</span><span class="nm"><span><span class="rl">'+role+'</span>'+
          '<a href="'+n.href+'">'+esc(n.name)+'</a></span>'+
          (n.sub?'<span class="sub">'+esc(n.sub)+'</span>':'')+'</span></div>';}).join('')+'</div>'+
          '<div class="note">'+(auth?'السلسلة من قاعدة رواة مفهرسة لكل حديث.':'لم تُفهرَس سلسلة هذا الحديث؛ استُخرجت الأسماء آليًّا وقد تنقص.')+'</div>'
         :'<div class="pane msg">لا سلسلة مفهرسة لهذا الحديث.</div>')+'</div>'+
      '<div class="panel" data-p="full"><div class="pane full"><span>'+esc(h.text)+'</span></div></div>'+
      '<div class="panel" data-p="hukm">'+
        (grades.length?'<div class="pane"><table class="t"><tr><th>المحدِّث</th><th>الحكم</th><th>معناه</th></tr>'+
          grades.map(g=>'<tr><td>'+esc(g[0])+'</td><td><span class="g '+gclass(g[1])+'">'+esc(g[1])+'</span></td>'+
          '<td style="color:var(--mut);font-size:.9rem">'+esc(gdef(g[1])||'—')+'</td></tr>').join('')+'</table></div>'+
          '<div class="note">الأحكام كما وردت عن قائليها. المنصة تنقل ولا ترجّح بينها.</div>'
         :'<div class="pane msg">لم يرد حكم مرفق في المصدر.</div>')+'</div>'+
      '<div class="panel" data-p="takh">'+
        (tak.length?'<div class="tiles">'+tak.map(r=>{const [bb,nn]=r.split(':');
          const bk=(B[bb]||{}).ar||bb;
          return '<a class="tile" href="#/'+bb+'/h/'+nn+'"><span class="n">'+AR(nn)+'</span>'+
            '<span class="t"><b>'+esc(bk)+'</b><span>حديث '+AR(nn)+'</span></span></a>';}).join('')+'</div>'+
          '<div class="note">مواضع ورود الحديث نفسه في كتبٍ أخرى، مستخرَجة بمطابقة المتن. المطابقة دقيقة متحفّظة، فقد تفوتها بعض الطرق.</div>'
         :'<div class="pane msg">لم يُعثر على تخريج لهذا الحديث في بقية الكتب المفهرسة.</div>')+'</div>'+
      '<div class="panel" data-p="sharh"><div id="sharh"></div></div>'+
      '</div>'+rail+'</div>'+
      '<div class="acts"><a class="act" href="index.html">ابحث عن ألفاظه</a>'+
      (sec?'<a class="act" href="#/'+k+'/'+sec.n+'/1">كل أحاديث الباب</a>':'')+'</div>'+pg;
    // التبويبات
    const root=document.getElementById('body');
    window.showTab=t=>{const btn=root.querySelector('.tab[data-t="'+t+'"]');
      if(btn){btn.click();btn.scrollIntoView({block:'center'});} return false;};
    root.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
      root.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
      root.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.p===t.dataset.t));
    });
    const sm=document.getElementById('sharh');
    if(sharh) sm.innerHTML='<div class="pane pad prose">'+paras(sharh.t)+'</div>'+
      '<div class="note">المصدر: '+esc(sharh.s)+
      (sharh.u?' <span class="sep">•</span> <a href="'+esc(sharh.u)+'" target="_blank" rel="noopener">الأصل ↗</a>':'')+'</div>';
    else sharhBlock(sp.matn||h.text,sm);
  }catch(e){ failed(document.getElementById('body'),e); }
}
</script></body></html>
