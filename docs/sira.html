<title>السيرة · تُراث</title></head><body>
<header class="nav"><div class="navin">
  <a class="brand" href="index.html"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.2l2.3 1.9 3-.3.8 2.9 2.6 1.6-1.2 2.8 1.2 2.8-2.6 1.6-.8 2.9-3-.3L12 21.8l-2.3-1.9-3 .3-.8-2.9L3.3 15.7l1.2-2.8-1.2-2.8 2.6-1.6.8-2.9 3 .3z" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.2"/></svg>تُراث</a>
  <nav class="navl"><a href="tafsir.html">التفسير</a><a href="hadith.html">الحديث</a><a href="rijal.html">الرواة</a><a href="sharh.html">الشروح</a><a href="sira.html" class="on">السيرة</a><a href="fiqh.html">الفقه</a>

</div></header>
<div class="shell"><aside class="side" id="side"></aside><main class="main" id="app"></main></div>
<script src="assets/app.js"></script>
<script>
theme(); firstVisitNotice(); document.getElementById('tg').innerHTML=TGL; document.getElementById('mnw').innerHTML=MENU;
mountMenu(document.getElementById('mn'),document.getElementById('side'));
const app=()=>document.getElementById('app'), side=()=>document.getElementById('side');
const FOOT='<footer class="foot" id="foot"></footer>';
function foot(){const f=document.getElementById('foot'); if(f)mountFooter(f);}
let EV=[],BK=[];
(async()=>{ try{ await searchInit(); EV=await siraEvents(); BK=await siraBooks(); }
  catch(e){ return failed(app(),e); }
  addEventListener('hashchange',route); route(); })();

function route(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(!h) return vLine();
  const p=h.split('/');
  if(p[0]==='b'){                              // كتب السيرة: تصفُّحًا وبحثًا
    const b=BK.find(x=>x.slug===p[1]);
    if(!b) return vBooks();
    if(p[2]==='q') return vSearch(b,p.slice(3).join('/'));
    if(p[2]==='r') return vRead(null,b,+p[3]||0,+p[4]||0,+p[5]||0);
    return vBook(b);
  }
  if(p[0]==='كتب') return vBooks();
  const e=EV.find(x=>x.id===p[0]);
  if(!e) return vLine();
  if(p[1]==='r'){ const b=BK.find(x=>x.slug===p[2]); if(b) return vRead(e,b,+p[3]||0,+p[4]||0,+p[5]||0); }
  return vEvent(e);
}
function sideLine(active){
  sidebar(side(),{title:'خطّ الأحداث',active,
    items:EV.map(e=>({key:e.id,href:'#/'+e.id,label:e.ar,side:siraYear(e.y)||'—'}))
      .concat(BK.map(b=>({key:'b:'+b.slug,href:'#/b/'+b.slug,label:b.ar,side:'كتاب'})))});
}
function sideBooks(active){
  sidebar(side(),{title:'كتب السيرة',active,
    items:BK.map(b=>({key:b.slug,href:'#/b/'+b.slug,label:b.ar,side:AR(b.vols)+' ج'}))
      .concat([{key:'line',href:'#/',label:'خطّ الأحداث',side:AR(EV.length)}])});
}
function box(b,q){
  return '<div class="sbox"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'+
   '<input id="q" type="search" placeholder="ابحث في '+esc(b.ar)+'…" value="'+esc(q||'')+'" autocomplete="off"><kbd>↵</kbd></div>';
}
function wire(b){
  const i=document.getElementById('q'); if(!i)return;
  i.onkeydown=e=>{ if(e.key==='Enter'&&i.value.trim()) location.hash='#/b/'+b.slug+'/q/'+encodeURIComponent(i.value.trim()); };
}

/* ── كتب السيرة: تُقرأ وتُبحث كتبًا، لا مواضعَ معلَّقةً بالأحداث وحدها ── */
function vBooks(){
  sideBooks();
  app().innerHTML='<nav class="crumb"><a href="#/">السيرة</a><span class="sep">›</span><span>الكتب</span></nav>'+
   '<section class="ph"><div class="k">أصول السيرة</div><h1>كتب السيرة</h1>'+
   '<div class="m"><bdi>'+AR(BK.length)+' '+(BK.length===2?'كتابين':BK.length<=10?'كتب':'كتابًا')+'</bdi><span class="sep">•</span>'+
   '<bdi>'+AR(BK.reduce((a,b)=>a+b.paras,0))+' فقرة</bdi></div></section>'+
   '<div class="note" style="margin-bottom:1rem">هذه كتبُ أخبارٍ ومغازٍ لا كتبُ حديثٍ على شرط '+
   'الصحيح: تُساق فيها الرواية مرسلةً وبغير إسنادٍ أحيانًا. تُقرأ وتُبحث كما هي بجزئها وصفحتها.</div>'+
   '<div class="bento">'+BK.map(b=>
     '<a class="cell b3 card" href="#/b/'+b.slug+'"><div class="ch"><h3>'+esc(b.ar)+'</h3>'+
     '<span class="cn"><bdi>'+AR(b.vols)+'</bdi><small>مجلّدًا</small></span></div>'+
     '<p class="au">'+esc(b.author)+'<span class="sep">•</span>ت'+AR(b.died)+'هـ</p>'+
     '<p>'+esc(b.note||b.full)+'</p>'+
     '<div class="meta"><bdi>'+AR(b.paras)+' فقرة</bdi><span class="go">افتح ←</span></div></a>').join('')+
   '</div>'+FOOT;
  foot(); scrollTo(0,0);
}
async function vBook(b){
  sideBooks(b.slug);
  app().innerHTML='<nav class="crumb"><a href="#/">السيرة</a><span class="sep">›</span>'+
   '<a href="#/b/'+b.slug+'">الكتب</a><span class="sep">›</span><span>'+esc(b.ar)+'</span></nav>'+
   '<section class="ph"><div class="k">'+esc(b.author)+'<span class="sep">•</span>ت'+AR(b.died)+'هـ</div>'+
   '<h1>'+esc(b.ar)+'</h1><div class="m">'+esc(b.full)+'</div></section>'+
   box(b)+
   '<div class="acts"><a class="act" href="#/b/'+b.slug+'/r/0/0">اقرأ من أوّله</a>'+
   '<a class="act" href="#/">خطّ الأحداث ←</a></div>'+
   '<div class="sh"><h2>الأبواب</h2><span class="cnt" id="tn"></span><span class="ln"></span></div>'+
   '<div id="toc"></div>'+FOOT;
  wire(b); foot(); scrollTo(0,0);
  const toc=await sharhToc(b.slug);
  document.getElementById('tn').innerHTML='<bdi>'+AR(toc.length)+'</bdi>';
  document.getElementById('toc').innerHTML=tocGroups(toc,'#/b/'+b.slug+'/r/');
}
async function vSearch(b,q){
  sideBooks(b.slug);
  app().innerHTML='<nav class="crumb"><a href="#/">السيرة</a><span class="sep">›</span>'+
   '<a href="#/b/'+b.slug+'">'+esc(b.ar)+'</a><span class="sep">›</span><span>بحث</span></nav>'+
   '<section class="ph"><div class="k">بحث في '+esc(b.ar)+'</div><h1>«'+esc(q)+'»</h1></section>'+
   box(b,q)+'<div id="res"></div>'+FOOT;
  wire(b); foot(); scrollTo(0,0);
  const res=document.getElementById('res');
  res.innerHTML='<div class="sstat"><span class="spin"></span><span>يبحث…</span><span class="bar"><i style="width:8%"></i></span></div>';
  try{
    const hits=await sharhFind(b.slug,q,{limit:40,onprog:(d,t)=>{
      const bar=res.querySelector('.bar i'); if(bar)bar.style.width=Math.round(8+d/t*92)+'%';}});
    if(!hits.length){ res.innerHTML='<div class="pane msg">لا مواضع لـ«'+esc(q)+'» في '+esc(b.ar)+'.</div>'; return; }
    res.innerHTML='<div class="sstat"><bdi>'+AR(hits.length)+' موضعًا</bdi>'+(hits.length>=40?' (أول ٤٠)':'')+
      '<span class="sep">•</span><span>مع دليل كل موضع</span></div>'+
      sharhRank(hits,q,null).map(h=>siraCard(b.slug,h,q)).join('');
  }catch(e){ failed(res,e); }
}
/* بطاقة الموضع نفسها المستعملة في الشروح، ورابطُها إلى قارئ السيرة */
function siraCard(slug,h,q){
  return sharhCard(slug,h,q,null,{open:false})
    .replace(/<\/div>$/,'<a class="evgo" href="#/b/'+slug+'/r/'+h.c+'/'+h.i+'">اقرأ الموضع في الكتاب وما حوله ←</a></div>');
}

/* ── الخطّ: تُقرأ السيرة كلُّها في دقائق، ولكلّ حدثٍ ما قام عليه ── */
function vLine(){
  sideLine();
  const n=EV.reduce((a,e)=>a+e.nh,0);
  app().innerHTML='<nav class="crumb"><span>السيرة</span></nav>'+
   '<section class="ph"><div class="k">خطّ الأحداث</div><h1>السيرة النبوية</h1>'+
   '<div class="m"><bdi>'+AR(EV.length)+' حدثًا</bdi><span class="sep">•</span>'+
   '<bdi>'+AR(n)+' حديثًا موصولًا</bdi><span class="sep">•</span>كتابا سيرة</div></section>'+
   '<div class="note" style="margin-bottom:1.4rem">لسنا نروي السيرة، بل نعرض ما قام عليه كلُّ حدثٍ '+
   'من المصادر. مع كلّ حدثٍ شريطٌ يبيّن أفي القرآن هو، أم في كتب الحديث، أم في كتب السيرة وحدها '+
   'ولكلّ نصٍّ موضعُه ليُراجَع. المنصة تنقل ولا ترجّح.</div>'+
   '<div class="acts" style="margin-bottom:1.4rem">'+BK.map(b=>
     '<a class="act" href="#/b/'+b.slug+'">ابحث في '+esc(b.ar)+' ←</a>').join('')+
   '<a class="act" href="#/كتب">كل كتب السيرة</a></div>'+
   '<ol class="line">'+EV.map(e=>
     '<li class="lev"><a href="#/'+e.id+'">'+
       '<span class="ldot"></span>'+
       '<span class="lbod">'+
         '<span class="lhd"><b>'+esc(e.ar)+'</b>'+
         (e.when?'<span class="lwhen'+(e.whenFrom==='ترتيب'?' soft':'')+'"><bdi>'+esc(e.when)+'</bdi></span>':'')+'</span>'+
         '<span class="lmeta">'+[esc(e.place),siraAgeAr(e.y)].filter(Boolean).join('<span class="sep">•</span>')+'</span>'+
         siraTier(e.tier)+
       '</span></a></li>').join('')+'</ol>'+
   '<div class="note">«ابن نحو كذا» حسابٌ على المشهور: بُعث على رأس الأربعين، وهاجر بعد ثلاث '+
   'عشرة من مبعثه. وهو تقريبٌ يُراجَع في مواضعه من الكتب.</div>'+FOOT;
  foot(); scrollTo(0,0);
}

/* ── الحدث: الطبقات مرتَّبةً بقوّتها ── */
function vEvent(e){
  sideLine(e.id);
  const i=EV.indexOf(e), pv=EV[i-1], nx=EV[i+1];
  const pg='<div class="pager">'+
    (pv?'<a href="#/'+pv.id+'">‹ '+esc(pv.ar)+'</a>':'<span class="off">‹ السابق</span>')+
    '<span class="mid"><bdi>'+esc(e.when||e.ar)+'</bdi></span>'+
    (nx?'<a href="#/'+nx.id+'">'+esc(nx.ar)+' ›</a>':'<span class="off">التالي ›</span>')+'</div>';
  app().innerHTML=
   '<nav class="crumb"><a href="#/">السيرة</a><span class="sep">›</span><span>'+esc(e.ar)+'</span></nav>'+pg+
   '<section class="ph"><div class="k">'+
     ([esc(e.place),esc(e.when)].filter(Boolean).join('<span class="sep">•</span>')||'من خطّ الأحداث')+'</div>'+
   '<h1>'+esc(e.ar)+'</h1>'+
   (siraAgeAr(e.y)?'<div class="m">'+siraAgeAr(e.y)+'</div>':'')+'</section>'+
   (e.whenFrom==='ترتيب'?'<div class="note" style="margin-bottom:1rem">لم يُنصّ تاريخُ هذا الحدث في '+
     'عنوانه، وإنما حُصر بما قبله وما بعده من ترتيب الواقدي، وترتيبُه على التاريخ.</div>':'')+
   siraTier(e.tier,{full:true})+
   '<div id="body"></div>'+pg+FOOT;
  foot(); scrollTo(0,0);
  const b=document.getElementById('body');
  b.innerHTML=secQuran(e)+secHadith(e)+secSira(e);
  wireMore(b);
  /* سببُ نزول ما نزل في الحدث — يُلحق بآياته بعد رسمها */
  (async()=>{
    const keys=[];
    for(const g of e.quran) for(const x of g.vs) keys.push([x.s,x.v]);
    if(!keys.length)return;
    const found=[];
    for(const [s,v] of keys.slice(0,40)){
      const r=await asbab(s,v);
      for(const it of r) if(!found.some(f=>f.t===it.t)) found.push(it);
    }
    const host=b.querySelector('#asbab');
    if(host&&found.length) host.innerHTML=asbabBlock(found);
  })();
}

const SH2=(t,n)=>'<div class="sh"><h2>'+esc(t)+'</h2>'+(n!=null?'<span class="cnt"><bdi>'+AR(n)+'</bdi></span>':'')+'<span class="ln"></span></div>';

/* ما نزل في الحدث من القرآن — أعلى الطبقات ثبوتًا */
function secQuran(e){
  if(!e.quran.length) return SH2('ما نزل فيه من القرآن',0)+
    '<div class="pane msg">لم نصِل بهذا الحدث آيةً بنصٍّ من مصادرنا. '+
    'وليس هذا نفيًا؛ إنّما لم يقم عندنا دليلٌ نعرضه.</div>';
  const n=e.quran.reduce((a,g)=>a+g.vs.length,0);
  return SH2('ما نزل فيه من القرآن',n)+e.quran.map(g=>{
    const s=g.vs[0].s, v1=g.vs[0].v, v2=g.vs[g.vs.length-1].v;
    return '<div class="ev ev-sure">'+
      '<div class="evh"><span class="evb">القرآن</span>'+
      '<span class="evp">'+esc(g.vs[0].sar)+' <bdi>'+AR(v1)+(v2>v1?'–'+AR(v2):'')+'</bdi></span></div>'+
      '<ul class="evw"><li class="ok">'+esc(g.why)+
        (g.src?' <span class="sep">•</span> '+esc(g.src.ar)+' <bdi>ج'+AR(g.src.v)+' ص'+AR(g.src.p)+'</bdi>':'')+'</li></ul>'+
      '<div class="evt amiri qv">'+g.vs.map(x=>
        '<p class="aya"><span class="an"><bdi>'+AR(x.v)+'</bdi></span>'+esc(x.t)+'</p>').join('')+'</div>'+
      '<a class="evgo" href="tafsir.html#/'+s+'/ar-tafsir-ibn-kathir/'+v1+'">اقرأ تفسيرها ←</a>'+
    '</div>';}).join('')+'<div id="asbab"></div>';
}

/* ما رُوي فيه من كتب الحديث — بموضع الذكر مُبرَزًا ودرجته من صفحته */
function secHadith(e){
  if(!e.nh) return SH2('ما رُوي فيه من كتب الحديث',0)+
    '<div class="pane msg">لم يثبت عندنا وصلُ حديثٍ بهذا الحدث بالمفتاحين معًا.</div>';
  const B=SEARCH.books||{};
  const per={}; e.hadith.forEach(h=>(per[h.b]=per[h.b]||[]).push(h));
  const first=12;
  return SH2('ما رُوي فيه من كتب الحديث',e.nh)+
    '<p class="evlead">وُصل كلُّ حديثٍ هنا بمفتاحين يقدّمهما المصنِّف نفسه: أن يكون في '+
    '<b>كتاب المغازي والسير</b> من كتابه، وأن يَرِد فيه اسمُ الحدث. وموضعُ الذكر مُبرَزٌ '+
    'لتراه، ودرجتُه على صفحة الحديث.</p>'+
    '<div class="hbooks">'+Object.keys(per).map(k=>
      '<span class="hb">'+esc((B[k]||{}).ar||k)+'<b><bdi>'+AR(per[k].length)+'</bdi></b></span>').join('')+'</div>'+
    '<div class="tiles more" data-first="'+first+'">'+e.hadith.map((h,j)=>{
      const bk=(B[h.b]||{}).ar||h.b;
      return '<a class="tile wrap hcard'+(j>=first?' hid':'')+'" href="hadith.html#/'+h.b+'/h/'+h.n+'">'+
        '<span class="n">'+AR(h.n)+'</span><span class="t"><b>'+esc(bk)+'</b>'+
        '<span class="cx">'+markWord(h.cx,h.q)+'</span></span></a>';}).join('')+'</div>'+
    (e.nh>first?'<button class="act moreb">اعرض بقيّة المواضع (<bdi>'+AR(e.nh-first)+'</bdi>)</button>':'')+
    '<div class="note">ما تراه في البطاقة موضعُ الذكر من فهرس البحث، مُجرَّدًا من الشكل للمطابقة؛ '+
    'والنصّ كما رُوي ودرجتُه على صفحة الحديث. وقد يفوت هذا الوصلَ ما رُوي في الحدث بغير اسمه، '+
    'أو في غير كتب المغازي من المصنَّف.</div>';
}

/* ما ساقه أهل السيرة — مفصولًا: ما جاء بإسنادٍ وما جاء بغيره.
   وخلطُهما يبخس الأوّل ويرفع الثاني، وكلاهما تضليل. */
function secSira(e){
  const M=e.anchor.filter(a=>a.musnad), X=e.anchor.filter(a=>!a.musnad);
  const tiles=(list)=>'<div class="tiles">'+list.map(a=>
      '<a class="tile wrap" href="#/'+e.id+'/r/'+a.b+'/'+a.c+'/'+a.i+'">'+
      '<span class="n">ج'+AR(a.v)+'</span><span class="t"><b>'+esc(a.t)+'</b>'+
      '<span>'+esc(a.ar)+' <span class="sep">•</span> ج'+AR(a.v)+' ص'+AR(a.p)+'</span></span></a>').join('')+
    '</div>';
  let out='';
  if(M.length) out+=SH2('ما أُسند من أخباره',M.length)+
    '<p class="evlead">دلائلُ النبوة للبيهقي يسوق أخبار السيرة <b>بأسانيدها</b> كما تُساق '+
    'الأحاديث، فهو بين الصحاح وبين كتب الأخبار المرسلة. والإسنادُ معروضٌ في الموضع فانظره.</p>'+
    tiles(M);
  if(X.length) out+=SH2('ما ساقه أهل الأخبار',X.length)+
    '<p class="evlead">هذه كتبُ أخبارٍ ومغازٍ وطبقات، لا كتبُ حديثٍ على شرط الصحيح: تُساق '+
    'فيها الرواية مرسلةً وبغير إسنادٍ أحيانًا. تُقرأ على أنّها كذلك.</p>'+tiles(X);
  return out;
}

/* إبراز موضع الذكر في السياق — على النصّ المطبَّع كما هو مخزَّن */
function markWord(cx,q){
  const at=cx.indexOf(q);
  if(at<0) return esc(cx);
  return '…'+esc(cx.slice(0,at))+'<mark>'+esc(q)+'</mark>'+esc(cx.slice(at+q.length))+'…';
}
function wireMore(root){
  const b=root.querySelector('.moreb'); if(!b)return;
  b.onclick=()=>{ root.querySelectorAll('.hcard.hid').forEach(x=>x.classList.remove('hid')); b.remove(); };
}

/* ── قراءة الموضع من كتاب السيرة، وما يليه ليقرأ متّصلًا ── */
/* القارئ واحد، يُدخَل إليه من حدثٍ أو من الكتاب مباشرةً */
async function vRead(e,b,ci,pi,part){
  const home=e?'#/'+e.id:'#/b/'+b.slug;
  e?sideLine(e.id):sideBooks(b.slug);
  app().innerHTML='<nav class="crumb"><a href="#/">السيرة</a><span class="sep">›</span>'+
   '<a href="'+home+'">'+esc(e?e.ar:b.ar)+'</a><span class="sep">›</span><span>قراءة</span></nav>'+
   '<section class="ph" id="ph"></section>'+(e?'':box(b))+'<div id="body"></div>'+FOOT;
  if(!e)wire(b);
  foot(); loading(document.getElementById('body'),'جارٍ فتح الباب…');
  try{
    const bb=await readBab(b.slug,ci,pi,part);
    if(!bb) throw new Error('لا فهرس لهذا الكتاب');
    const base=e?'#/'+e.id+'/r/'+b.slug:'#/b/'+b.slug+'/r';
    document.getElementById('ph').innerHTML='<div class="k">'+esc(b.ar)+'<span class="sep">•</span>'+esc(b.author)+'</div>'+
      '<h1>'+esc(bb.title)+'</h1><div class="m">'+(bb.box&&bb.box.ar?esc(babClean(bb.box.ar))+'<span class="sep">•</span>':'')+'ج'+AR(bb.v)+' ص'+AR(bb.p)+(e?'<span class="sep">•</span>'+esc(e.ar):'')+'</div>';
    if(bb.box){
      document.getElementById('body').innerHTML=boxBody(base,bb)+
        '<div class="acts"><a class="act" href="'+base+'/'+bb.kids[0].t[1]+'/'+bb.kids[0].t[2]+'">ابدأ من أوّل أبوابه</a></div>';
      scrollTo(0,0); return;
    }
    document.getElementById('body').innerHTML=
      babNav(base,bb)+babParts(base,bb,ci,pi)+babBody(bb,b.full)+
      '<div class="note">وهو كتاب أخبارٍ لا كتابُ حديثٍ على شرط الصحيح.</div>'+
      babParts(base,bb,ci,pi)+babNav(base,bb)+
      '<div class="acts"><a class="act" href="'+home+'">عُد إلى '+esc(e?e.ar:b.ar)+'</a>'+
      (e?'<a class="act" href="#/b/'+b.slug+'">كل أبواب '+esc(b.ar)+'</a>':'')+'</div>';
    scrollTo(0,0);
  }catch(err){ failed(document.getElementById('body'),err); }
}
</script></body></html>
