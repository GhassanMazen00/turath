<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="assets/app.css">
<script>(function(){var t=localStorage.getItem("turath-theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
<title>$1</title></head><body>
<header class="nav"><div class="navin">
  <a class="brand" href="index.html"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.2l2.3 1.9 3-.3.8 2.9 2.6 1.6-1.2 2.8 1.2 2.8-2.6 1.6-.8 2.9-3-.3L12 21.8l-2.3-1.9-3 .3-.8-2.9L3.3 15.7l1.2-2.8-1.2-2.8 2.6-1.6.8-2.9 3 .3z" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.2"/></svg>تُراث</a>
  <nav class="navl"><a href="tafsir.html" class="on">التفسير</a><a href="hadith.html">الحديث</a><a href="rijal.html">الرواة</a><a href="sharh.html">الشروح</a><a href="sira.html">السيرة</a>
  <span id="mnw"></span><span id="tg"></span></nav>
</div></header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="app"></main>
</div>
<script src="assets/app.js"></script>
<script>
theme(); document.getElementById('tg').innerHTML=TGL; document.getElementById('mnw').innerHTML=MENU;
mountMenu(document.getElementById('mn'),document.getElementById('side'));
let S=[],T=[]; const app=()=>document.getElementById('app'),side=()=>document.getElementById('side');
const FOOT='<footer class="foot" id="foot"></footer>';
function foot(){const f=document.getElementById('foot'); if(f)mountFooter(f);}
(async()=>{ try{ await searchInit(); S=SEARCH.surahs; T=SEARCH.tafsirs; }catch(e){ return failed(app(),e); }
  addEventListener('hashchange',route); route(); })();
function route(){
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(!p.length) return vSurahs();
  if(p.length===1) return vPick(+p[0]);
  if(p.length>=3) return vAyah(+p[0],p[1],+p[2]);
  vSurahs();
}
function sideSurahs(active){
  sidebar(side(),{title:'السور',active,
    items:S.map(x=>({key:x.n,href:'#/'+x.n,n:x.n,label:x.ar,side:AR(x.count)}))});
}
function sideAyat(n,slug,active){
  const s=S.find(x=>x.n===n); const a=[];
  for(let i=1;i<=s.count;i++) a.push({key:i,href:'#/'+n+'/'+slug+'/'+i,n:i,label:'الآية '+AR(i)});
  sidebar(side(),{title:'سورة '+s.ar,active,items:a});
}
function vSurahs(){
  sideSurahs();
  app().innerHTML='<nav class="crumb"><span>السور</span></nav>'+
   '<section class="ph"><div class="k">القرآن الكريم</div><h1>فهرس السور</h1>'+
   '<div class="m"><bdi>١١٤ سورة</bdi><span class="sep">•</span>اختر سورة ثم كتاب التفسير</div></section>'+
   '<div id="s"></div><div class="sh"><h2>السور</h2><span class="ln"></span></div>'+
   '<div class="tiles" id="g"></div>'+FOOT;
  document.getElementById('g').innerHTML=S.map(x=>
   '<a class="tile" href="#/'+x.n+'"><span class="n">'+AR(x.n)+'</span>'+
   '<span class="t"><b>'+esc(x.ar)+'</b><span>'+esc(x.rev)+'<span class="sep">•</span><bdi>'+AR(x.count)+' آية</bdi></span></span></a>').join('');
  mountSearch(document.getElementById('s'),{}); foot(); scrollTo(0,0);
}
function vPick(n){
  const s=S.find(x=>x.n===n); if(!s) return vSurahs();
  sideSurahs(n);
  app().innerHTML='<nav class="crumb"><a href="#/">السور</a><span class="sep">›</span><span>سورة '+esc(s.ar)+'</span></nav>'+
   '<section class="ph"><div class="k">سورة</div><h1>'+esc(s.ar)+'</h1>'+
   '<div class="m">'+esc(s.rev)+'<span class="sep">•</span><bdi>'+AR(s.count)+' آية</bdi></div></section>'+
   '<div class="sh"><h2>اختر كتاب التفسير</h2><span class="cnt"><bdi>'+AR(T.length)+'</bdi></span><span class="ln"></span></div>'+
   '<div class="bento">'+T.map(t=>'<a class="cell b3 card" href="#/'+n+'/'+t.slug+'/1">'+
     '<div class="ch"><h3>'+esc(t.ar)+'</h3><span class="cn"><small>'+esc(t.size)+'</small></span></div>'+
     '<p class="au">'+esc(t.author)+'</p>'+
     (TAFNOTE[t.slug]?'<p>'+esc(TAFNOTE[t.slug])+'</p>':'')+
     '<div class="meta"><bdi>'+AR(s.count)+' آية</bdi><span class="go">افتح ←</span></div></a>').join('')+'</div>'+FOOT;
  foot(); scrollTo(0,0);
}
async function vAyah(n,slug,a){
  const s=S.find(x=>x.n===n),t=T.find(x=>x.slug===slug);
  if(!s||!t) return vSurahs();
  a=Math.min(Math.max(1,a),s.count);
  sideAyat(n,slug,a);
  const pg=()=>{const p=a>1?'#/'+n+'/'+slug+'/'+(a-1):null,x=a<s.count?'#/'+n+'/'+slug+'/'+(a+1):null;
    return '<div class="pager">'+(p?'<a href="'+p+'">‹ الآية السابقة</a>':'<span class="off">‹ السابقة</span>')+
    '<span class="mid"><bdi>الآية '+AR(a)+' من '+AR(s.count)+'</bdi></span>'+
    (x?'<a href="'+x+'">الآية التالية ›</a>':'<span class="off">التالية ›</span>')+'</div>';};
  // الرفّ: التنقّل في السورة، وبقية التفاسير لهذه الآية بعينها
  const near=[];
  for(let i=Math.max(1,a-3);i<=Math.min(s.count,a+3);i++) near.push(i);
  const rail=
   '<aside class="rail">'+
     '<div class="rc glass"><h4>الموضع</h4><dl>'+
       '<dt>السورة</dt><dd>'+esc(s.ar)+'</dd>'+
       '<dt>الآية</dt><dd><bdi>'+AR(a)+' من '+AR(s.count)+'</bdi></dd>'+
       '<dt>النزول</dt><dd>'+esc(s.rev)+'</dd>'+
       '<dt>التفسير</dt><dd>'+esc(t.ar)+'</dd>'+
     '</dl></div>'+
     '<div class="rc glass"><h4>آيات مجاورة</h4><div class="lnk">'+
       near.map(i=>'<a href="#/'+n+'/'+slug+'/'+i+'"'+(i===a?' class="on"':'')+'>'+
         '<span>الآية '+AR(i)+'</span>'+(i===a?'<span class="n">هنا</span>':'')+'</a>').join('')+
     '</div></div>'+
     '<div class="rc glass"><h4>الآية نفسها في كتبٍ أخرى</h4><div class="lnk">'+
       T.filter(x=>x.slug!==slug).slice(0,9).map(x=>
         '<a href="#/'+n+'/'+x.slug+'/'+a+'"><span>'+esc(x.ar)+'</span><span class="n">'+esc(x.size)+'</span></a>').join('')+
     '</div></div>'+
   '</aside>';
  app().innerHTML='<nav class="crumb"><a href="#/">السور</a><span class="sep">›</span><a href="#/'+n+'">سورة '+esc(s.ar)+'</a><span class="sep">›</span><span>'+esc(t.ar)+'</span></nav>'+
   '<section class="ph"><div class="k">'+esc(t.ar)+'</div><h1>سورة '+esc(s.ar)+'</h1>'+
   '<div class="m">'+esc(t.author)+'</div></section>'+pg()+
   '<div class="dual"><div class="dcol" id="body"></div>'+rail+'</div>'+
   '<div id="botpg"></div>'+FOOT;
  loading(document.getElementById('body'),'جارٍ الجلب…'); foot(); scrollTo(0,0);
  try{
    const [av,tf,sb]=await Promise.all([api.ayah(n,a),api.tafsir(slug,n,a),asbab(n,a)]);
    document.getElementById('body').innerHTML=
      '<div class="pane ayah"><span class="tx">'+esc(av.text)+'<span class="an">'+AR(a)+'</span></span></div>'+
      asbabBlock(sb)+
      '<div class="sh"><h2>'+esc(t.ar)+'</h2><span class="ln"></span></div>'+
      '<div class="pane pad prose">'+paras(tf.text)+'</div>';
    document.getElementById('botpg').innerHTML=pg();
  }catch(e){ failed(document.getElementById('body'),e); }
}
</script></body></html>
